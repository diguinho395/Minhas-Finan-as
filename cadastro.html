<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criar conta — Minhas Finanças</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body class="auth">
<aside><b style="font-size:20px">Minhas Finanças</b><div><h2>Seu dinheiro, claro e sob controle.</h2><ul><li>Veja seu saldo e quanto sobrou no mês</li><li>Receba alertas de contas a vencer</li><li>Acompanhe metas por categoria</li></ul></div><small style="color:#9FB0CB">© Minhas Finanças</small></aside>
<main><form data-modo="cadastro" novalidate>
<div><h1>Criar conta</h1><p>Leva menos de um minuto.</p></div>
<div class="f"><label for="nome">Nome completo</label><input id="nome" name="nome" autocomplete="name" required></div>
<div class="f"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div>
<div class="f"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" required></div>
<div class="f"><label for="conf">Confirmar senha</label><input id="conf" name="conf" type="password" autocomplete="new-password" required></div>
<label class="chk" style="margin:0"><input type="checkbox" name="termos">Li e aceito os termos de uso e a política de privacidade.</label>
<div class="err" id="err" role="alert" hidden></div>
<button class="go">Criar conta</button>
<p style="text-align:center">Já tem conta? <a href="login.html">Entrar</a></p>
</form></main>
<script src="js/config.js"></script><script src="js/vendor/supabase.js"></script><script src="js/store.js"></script><script src="js/auth.js"></script></body></html>
